<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debug / Cek Isi Artikel Blogspot</title>
<style>
    body { font-family: monospace; background: #111; color: #00ff00; padding: 20px; }
    button { padding: 12px 20px; background: #00aaff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: sans-serif; }
    pre { background: #222; padding: 15px; border: 1px solid #333; overflow: auto; white-space: pre-wrap; word-wrap: break-word; color: #fff; margin-top: 15px; }
    .info { color: #ffcc00; font-family: sans-serif; margin-bottom: 15px; }
</style>
</head>
<body>

    <h2>Blogger Content Inspector</h2>
    <div class="info">Klik tombol di bawah untuk melihat teks asli yang dibaca oleh sistem dari blog Anda.</div>
    
    <button onclick="cekIsiBlog()">Ambil & Intip Isi Artikel</button>
    
    <pre id="output">Hasil teks artikel akan muncul di sini...</pre>

<script>
function cekIsiBlog(){
    document.getElementById("output").innerHTML = "Sedang mengambil data...";
    
    const oldScript = document.getElementById('bloggerJsonp');
    if(oldScript) oldScript.remove();

    const blogFeedUrl = "https://mahadewa666.blogspot.com/feeds/posts/default?alt=json&max-results=1&callback=tampilkanTeks";

    const script = document.createElement('script');
    script.id = 'bloggerJsonp';
    script.src = blogFeedUrl;
    script.onerror = function() {
        document.getElementById("output").innerHTML = "Gagal memuat feed blog. Pastikan URL blog benar dan publik.";
    };
    document.body.appendChild(script);
}

function tampilkanTeks(data) {
    try {
        if (!data.feed.entry || data.feed.entry.length === 0) {
            document.getElementById("output").innerHTML = "Error: Tidak ada artikel yang ditemukan di blog ini.";
            return;
        }

        const htmlContent = data.feed.entry[0].content.$t; 
        
        // Tampilkan HTML mentah dan teks bersihnya untuk dianalisis
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = htmlContent;
        const plainText = tempDiv.textContent || tempDiv.innerText || "";

        let logResult = "=== JUDUL ARTIKEL ===\n" + data.feed.entry[0].title.$t + "\n\n";
        logResult += "=== TEKS YANG BERHASIL DIEKSTRAK (Cek apakah ada #EXTINF dan link http di bawah ini) ===\n";
        logResult += plainText;
        logResult += "\n\n=== KODE HTML ASLI DARI BLOGGER ===\n";
        logResult += htmlContent;

        document.getElementById("output").textContent = logResult;

    } catch(err) {
        document.getElementById("output").innerHTML = "Gagal memproses data: " + err.message;
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>IPTV Playlist Viewer</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:0;
}

.header{
    padding:15px;
    background:#1a1a1a;
    position:sticky;
    top:0;
    z-index: 10;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
    box-sizing: border-box;
}

button{
    width:100%;
    padding:12px;
    background:#00aaff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    box-sizing: border-box;
    font-weight: bold;
}

button:hover{
    opacity:.9;
}

.container{
    display:flex;
    flex-wrap:wrap;
}

.left{
    width:350px;
    max-height:calc(100vh - 180px);
    overflow:auto;
    border-right:1px solid #333;
}

.right{
    flex:1;
    padding:10px;
}

.channel{
    padding:12px;
    border-bottom:1px solid #222;
    cursor:pointer;
}

.channel:hover{
    background:#222;
}

video{
    width:100%;
    max-height:80vh;
    background:black;
}

.status{
    margin-top:10px;
    color:#ffcc00;
}

@media(max-width:768px){
    .left{
        width:100%;
        max-height:300px;
    }

    .right{
        width:100%;
    }
}
</style>

</head>
<body>

<div class="header">

<input
id="playlistUrl"
value="https://premium.ksa.my.id/playlist/fzpw/playlist.m3u8"
placeholder="Paste URL Artikel Blogspot ATAU Link Playlist M3U/M3U8 di sini">

<button onclick="loadPlaylist()">
Load Playlist
</button>

<input
id="search"
placeholder="Cari Channel..."
onkeyup="filterChannels()">

<div class="status" id="status">Ready. Klik Load untuk memuat playlist.</div>

</div>

<div class="container">

<div class="left">
    <div id="channelList"></div>
</div>

<div class="right">

<h3 id="currentChannel">
Belum ada channel dipilih
</h3>

<video
id="video"
controls
autoplay>
</video>

</div>

</div>

<script>

let allChannels = [];

async function loadPlaylist(){
    document.getElementById("status").innerHTML = "Memproses URL...";
    allChannels = [];

    const targetUrl = document.getElementById("playlistUrl").value.trim();
    
    if (!targetUrl) {
        document.getElementById("status").innerHTML = "Error: URL tidak boleh kosong.";
        return;
    }

    // OPSI 1: Jika Input berupa Link Artikel Blogspot
    if (targetUrl.includes("blogspot.com")) {
        document.getElementById("status").innerHTML = "Menghubungkan ke Google Server (Blogspot)...";
        try {
            const urlObj = new URL(targetUrl);
            const domain = urlObj.origin; 
            const path = urlObj.pathname; 

            const oldScript = document.getElementById('bloggerJsonp');
            if(oldScript) oldScript.remove();

            const nativeFeedUrl = `${domain}/feeds/posts/default?alt=json&path=${encodeURIComponent(path)}&callback=handleBloggerData`;

            const script = document.createElement('script');
            script.id = 'bloggerJsonp';
            script.src = nativeFeedUrl;
            script.onerror = function() {
                document.getElementById("status").innerHTML = "Gagal memuat data Blogspot.";
            };
            document.body.appendChild(script);
        } catch (e) {
            document.getElementById("status").innerHTML = "URL Blogspot tidak valid.";
        }
    } 
    // OPSI 2: Jika Input berupa URL File Playlist M3U/M3U8 Langsung (seperti premium.ksa.my.id)
    else {
        document.getElementById("status").innerHTML = "Mengambil data file M3U via CORS Proxy...";
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        
        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("Gagal menembus proteksi file luar.");
            
            const data = await response.json();
            const rawM3uText = data.contents; // Mendapatkan text mentah isi m3u8

            parsePlaylistStrict(rawM3uText);

            if(allChannels.length > 0) {
                document.getElementById("status").innerHTML = allChannels.length + " channel berhasil dimuat dari link langsung!";
            } else {
                document.getElementById("status").innerHTML = "0 channel ditemukan. Periksa struktur konten file m3u8.";
            }
        } catch(err) {
            document.getElementById("status").innerHTML = "Gagal memuat file playlist dari link tersebut.";
            console.error(err);
        }
    }
}

function handleBloggerData(data) {
    try {
        if (!data.feed.entry || data.feed.entry.length === 0) {
            throw new Error('Artikel tidak ditemukan.');
        }

        const htmlContent = data.feed.entry[0].content.$t; 
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = htmlContent;
        
        let textWithNewlines = tempDiv.innerHTML
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<\/p>/gi, '\n')
            .replace(/<div[^>]*>/gi, '\n')
            .replace(/<\/div>/gi, '\n')
            .replace(/&nbsp;/g, ' ')
            .replace(/\u00a0/g, ' ');

        const cleanDiv = document.createElement("div");
        cleanDiv.innerHTML = textWithNewlines;
        const plainTextPlaylist = cleanDiv.textContent || cleanDiv.innerText || "";

        parsePlaylistStrict(plainTextPlaylist);

        if(allChannels.length > 0) {
            document.getElementById("status").innerHTML = allChannels.length + " channel ditemukan dari Blogspot!";
        } else {
            document.getElementById("status").innerHTML = "0 channel ditemukan. Periksa format teks artikel.";
        }
    } catch(err) {
        document.getElementById("status").innerHTML = "Gagal memproses struktur artikel.";
        console.error(err);
    }
}

function parsePlaylistStrict(text) {
    const lines = text.split(/\n+/);
    let currentName = "";

    for(let i=0; i<lines.length; i++){
        let currentLine = lines[i].trim();

        if(currentLine.toUpperCase().includes("#EXTINF")){
            currentName = currentLine.split(",").pop().trim();
            continue;
        }

        if(/^https?:\/\//i.test(currentLine) && currentName !== ""){
            allChannels.push({
                name: currentName,
                url: currentLine
            });
            currentName = ""; 
        }
    }

    renderChannels(allChannels);
}

function renderChannels(channels){
    const container = document.getElementById("channelList");
    container.innerHTML = "";

    channels.forEach(ch=>{
        const div = document.createElement("div");
        div.className = "channel";
        div.innerHTML = ch.name;

        div.onclick = function(){
            playChannel(ch.url);
            document.getElementById("currentChannel").innerHTML = ch.name;
        };

        container.appendChild(div);
    });
}

function filterChannels(){
    const keyword = document.getElementById("search").value.toLowerCase();
    const result = allChannels.filter(ch =>
        ch.name.toLowerCase().includes(keyword)
    );
    renderChannels(result);
}

function playChannel(url){
    const video = document.getElementById("video");

    if(window.hls){
        window.hls.destroy();
    }

    if(Hls.isSupported()){
        const hls = new Hls();
        window.hls = hls;
        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function(){
            video.play().catch(e => {
                console.log("Autoplay ditangguhkan browser.");
            });
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                video.src = url; 
            }
        });
    } else {
        video.src = url;
        video.play();
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>IPTV Playlist Viewer</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:0;
}

.header{
    padding:15px;
    background:#1a1a1a;
    position:sticky;
    top:0;
    z-index: 10;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
    box-sizing: border-box;
}

button{
    width:100%;
    padding:12px;
    background:#00aaff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    box-sizing: border-box;
    font-weight: bold;
}

button:hover{
    opacity:.9;
}

.container{
    display:flex;
    flex-wrap:wrap;
}

.left{
    width:350px;
    max-height:calc(100vh - 180px);
    overflow:auto;
    border-right:1px solid #333;
}

.right{
    flex:1;
    padding:10px;
}

.channel{
    padding:12px;
    border-bottom:1px solid #222;
    cursor:pointer;
}

.channel:hover{
    background:#222;
}

video{
    width:100%;
    max-height:80vh;
    background:black;
}

.status{
    margin-top:10px;
    color:#aaa;
}

@media(max-width:768px){
    .left{
        width:100%;
        max-height:300px;
    }

    .right{
        width:100%;
    }
}
</style>

</head>
<body>

<div class="header">

<input
id="playlistUrl"
value="https://bit.ly/pengembarahitam"
placeholder="Paste URL Playlist">

<button onclick="loadPlaylist()">
Load Playlist
</button>

<input
id="search"
placeholder="Cari Channel..."
onkeyup="filterChannels()">

<div class="status" id="status"></div>

</div>

<div class="container">

<div class="left">
    <div id="channelList"></div>
</div>

<div class="right">

<h3 id="currentChannel">
Belum ada channel dipilih
</h3>

<video
id="video"
controls
autoplay>
</video>

</div>

</div>

<script>

let allChannels = [];

async function loadPlaylist(){

    document.getElementById("status").innerHTML = "Loading playlist...";

    // Menggunakan RSS feed resmi Blogger agar bypass CORS 100% aman
    const blogFeedUrl = "https://mahadewa666.blogspot.com/feeds/posts/default?alt=json&max-results=1";

    try{

        const response = await fetch(blogFeedUrl);
        if (!response.ok) throw new Error('Gagal memuat feed dari Blogger.');

        const data = await response.json();
        if (!data.feed.entry || data.feed.entry.length === 0) {
            throw new Error('Tidak ada artikel ditemukan.');
        }

        const htmlContent = data.feed.entry[0].content.$t; 

        // Ekstraksi teks murni dari HTML artikel
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = htmlContent;
        
        // Mengganti tag break line menjadi baris baru nyata agar parser m3u bekerja sempurna
        let formattedText = tempDiv.innerHTML
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<\/p>/gi, '\n')
            .replace(/<div[^>]*>/gi, '\n')
            .replace(/<\/div>/gi, '\n');

        const cleanDiv = document.createElement("div");
        cleanDiv.innerHTML = formattedText;
        const plainTextPlaylist = cleanDiv.textContent || cleanDiv.innerText || "";

        parsePlaylist(plainTextPlaylist);

        if(allChannels.length > 0) {
            document.getElementById("status").innerHTML = allChannels.length + " channel ditemukan";
        } else {
            document.getElementById("status").innerHTML = "0 channel ditemukan. Periksa format penulisan M3U di Blogger.";
        }

    }catch(err){
        document.getElementById("status").innerHTML = "Gagal membaca playlist dari Blogger.";
        console.error(err);
    }
}

function parsePlaylist(text){

    allChannels = [];
    // Pisahkan baris secara fleksibel terhadap spasi / carriage return
    const lines = text.split(/\n+/);

    for(let i=0; i<lines.length; i++){
        let currentLine = lines[i].trim();

        if(currentLine.includes("#EXTINF")){
            let name = currentLine.split(",").pop().trim();
            let stream = "";
            
            // Cari baris berisi URL http setelah info channel ditemukan
            for (let j = i + 1; j < lines.length; j++) {
                let nextLine = lines[j].trim();
                if (nextLine.startsWith("http")) {
                    stream = nextLine;
                    break;
                } else if (nextLine.includes("#EXTINF")) {
                    break;
                }
            }

            if(stream){
                allChannels.push({
                    name: name,
                    url: stream
                });
            }
        }
    }

    renderChannels(allChannels);
}

function renderChannels(channels){

    const container = document.getElementById("channelList");
    container.innerHTML = "";

    channels.forEach(ch=>{

        const div = document.createElement("div");
        div.className = "channel";
        div.innerHTML = ch.name;

        div.onclick = function(){
            playChannel(ch.url);
            document.getElementById("currentChannel").innerHTML = ch.name;
        };

        container.appendChild(div);
    });
}

function filterChannels(){

    const keyword = document.getElementById("search").value.toLowerCase();
    const result = allChannels.filter(ch =>
        ch.name.toLowerCase().includes(keyword)
    );
    renderChannels(result);
}

function playChannel(url){

    const video = document.getElementById("video");

    if(window.hls){
        window.hls.destroy();
    }

    const finalUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);

    if(Hls.isSupported()){

        const hls = new Hls({
            xhrSetup: function (xhr, url) {
                if (!url.includes('corsproxy.io')) {
                    xhr.open('GET', 'https://corsproxy.io/?' + encodeURIComponent(url), true);
                }
            }
        });

        window.hls = hls;
        hls.loadSource(finalUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function(){
            video.play().catch(e => console.log("Autoplay ditahan browser. Click play manual."));
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                video.src = url; 
            }
        });

    } else {
        video.src = url;
        video.play();
    }
}

</script>

</body>
</html>

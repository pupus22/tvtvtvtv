<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV Playlist Downloader</title>
<style>
    body { font-family: Arial, sans-serif; background: #111; color: white; text-align: center; padding: 50px 20px; }
    .card { max-width: 500px; margin: 0 auto; background: #1a1a1a; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    button { width: 100%; padding: 14px; background: #00aaff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; }
    button:hover { opacity: .9; }
    .status { margin-top: 15px; color: #aaa; font-size: 14px; }
</style>
</head>
<body>

<div class="card">
    <h2>IPTV M3U Converter</h2>
    <p>Ambil playlist dari Blogspot dan simpan sebagai file lokal untuk VLC / Android Player.</p>
    
    <button onclick="downloadM3U()">Generate & Download .M3U</button>
    <div class="status" id="status">Ready</div>
</div>

<script>
function downloadM3U() {
    document.getElementById("status").innerHTML = "Menghubungi Blogger...";

    const oldScript = document.getElementById('bloggerJsonp');
    if(oldScript) oldScript.remove();

    // Bypass CORS menggunakan JSONP
    const blogFeedUrl = "https://mahadewa666.blogspot.com/feeds/posts/default?alt=json&max-results=1&callback=processData";

    const script = document.createElement('script');
    script.id = 'bloggerJsonp';
    script.src = blogFeedUrl;
    script.onerror = function() {
        document.getElementById("status").innerHTML = "Gagal memuat data blog.";
    };
    document.body.appendChild(script);
}

function processData(data) {
    try {
        if (!data.feed.entry || data.feed.entry.length === 0) {
            throw new Error('Artikel tidak ditemukan.');
        }

        const htmlContent = data.feed.entry[0].content.$t; 
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = htmlContent;
        
        let formattedText = tempDiv.innerHTML
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<\/p>/gi, '\n')
            .replace(/<div[^>]*>/gi, '\n')
            .replace(/<\/div>/gi, '\n');

        const cleanDiv = document.createElement("div");
        cleanDiv.innerHTML = formattedText;
        const plainText = cleanDiv.textContent || cleanDiv.innerText || "";

        // Bersihkan dan susun format M3U8 murni
        const lines = plainText.split(/\n+/);
        let m3uOutput = "#EXTM3U\n";
        let count = 0;

        for (let i = 0; i < lines.length; i++) {
            let currentLine = lines[i].trim();
            if (currentLine.includes("#EXTINF")) {
                let name = currentLine.split(",").pop().trim();
                let stream = "";
                
                for (let j = i + 1; j < lines.length; j++) {
                    let nextLine = lines[j].trim();
                    if (nextLine.startsWith("http")) {
                        stream = nextLine;
                        break;
                    } else if (nextLine.includes("#EXTINF")) {
                        break;
                    }
                }

                if (stream) {
                    m3uOutput += `#EXTINF:-1,${name}\n${stream}\n`;
                    count++;
                }
            }
        }

        if (count > 0) {
            // Membuat trigger download file .m3u otomatis ke komputer/HP
            const blob = new Blob([m3uOutput], { type: 'text/plain' });
            const fileUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = fileUrl;
            link.download = 'playlist_zack.m3u';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            document.getElementById("status").innerHTML = `Berhasil mengunduh ${count} channel!`;
        } else {
            document.getElementById("status").innerHTML = "Format playlist di dalam artikel tidak valid.";
        }

    } catch(err) {
        document.getElementById("status").innerHTML = "Gagal memproses file.";
        console.error(err);
    }
}
</script>

</body>
</html>
